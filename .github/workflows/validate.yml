name: Validate repositories.yaml

on:
  push:
    paths:
      - repositories.yaml
  pull_request_target:
    types: [opened, synchronize, reopened]
    paths:
      - repositories.yaml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout base revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Prepare repositories.yaml
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -eu
          mkdir -p ci-input

          require_sha() {
            if ! printf '%s' "$1" | grep -Eq '^[0-9a-fA-F]{40}$'; then
              echo "Unexpected commit SHA."
              exit 1
            fi
          }

          download() {
            repo="$1"
            sha="$2"
            dest="$3"
            require_sha "$sha"
            if ! printf '%s' "$repo" | grep -Eq '^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$'; then
              echo "Unexpected repository name."
              exit 1
            fi
            curl --fail --silent --show-error --location --retry 3 --retry-delay 2 \
              "https://raw.githubusercontent.com/${repo}/${sha}/repositories.yaml" \
              --output "$dest"
            test -s "$dest"
          }

          if [ "$EVENT_NAME" = "pull_request_target" ]; then
            if [ -z "$HEAD_REPO" ]; then
              echo "Pull request head repository is not available."
              exit 1
            fi
            download "$HEAD_REPO" "$HEAD_SHA" ci-input/head.yaml
            download "$GITHUB_REPOSITORY" "$BASE_SHA" ci-input/base.yaml
          elif [ "$EVENT_NAME" = "push" ]; then
            cp repositories.yaml ci-input/head.yaml
            if [ -z "$BEFORE_SHA" ] || [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
              echo "No base revision, skipping description length check." | tee ci-input/skip-length
            else
              download "$GITHUB_REPOSITORY" "$BEFORE_SHA" ci-input/base.yaml
            fi
          else
            cp repositories.yaml ci-input/head.yaml
            echo "No previous revision, skipping description length check." | tee ci-input/skip-length
          fi

      - name: Validate YAML against JSON Schema
        uses: cardinalby/schema-validator-action@v3
        with:
          file: ci-input/head.yaml
          schema: https://raw.githubusercontent.com/abordage/schemas/main/schemas/awesome-repositories/awesome-repositories.schema.json

      - name: Check description length
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -eu
          python3 -m pip install --disable-pip-version-check pyyaml
          python3 .github/scripts/check_description_length.py --self-test
          if [ -f ci-input/skip-length ]; then
            cat ci-input/skip-length
            exit 0
          fi
          python3 .github/scripts/check_description_length.py ci-input/head.yaml --base ci-input/base.yaml
